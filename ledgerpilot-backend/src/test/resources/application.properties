spring.datasource.url=jdbc:h2:mem:ledgerpilot;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.enabled=true
app.auth.jwt-secret=test-secret-that-is-at-least-thirty-two-bytes-long
app.auth.issuer=ledgerpilot-test
app.auth.audience=ledgerpilot-web-test
app.auth.access-token-minutes=10
app.auth.refresh-token-days=30
app.auth.cookie-secure=false
app.auth.cookie-same-site=Lax
app.auth.frontend-base-url=http://localhost:5173
app.cors.allowed-origins=http://localhost:5173
app.mail.from=test@ledgerpilot.local
spring.mail.host=localhost
spring.mail.port=2525
