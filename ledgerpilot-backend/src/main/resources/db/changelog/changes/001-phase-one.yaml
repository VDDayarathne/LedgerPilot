databaseChangeLog:
  - changeSet:
      id: 001-phase-one-auth-tenancy
      author: codex
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              CREATE TABLE users (id CHAR(36) NOT NULL PRIMARY KEY, email VARCHAR(254) NOT NULL, password_hash VARCHAR(100) NOT NULL, display_name VARCHAR(120) NOT NULL, email_verified BOOLEAN NOT NULL DEFAULT FALSE, enabled BOOLEAN NOT NULL DEFAULT TRUE, created_at TIMESTAMP(6) NOT NULL, updated_at TIMESTAMP(6) NOT NULL, version BIGINT NOT NULL DEFAULT 0, CONSTRAINT uk_users_email UNIQUE (email));
              CREATE TABLE tenants (id CHAR(36) NOT NULL PRIMARY KEY, name VARCHAR(160) NOT NULL, slug VARCHAR(100) NOT NULL, status VARCHAR(20) NOT NULL, country_code CHAR(2) NOT NULL DEFAULT 'LK', base_currency CHAR(3) NOT NULL DEFAULT 'LKR', fiscal_year_start_month SMALLINT NOT NULL DEFAULT 1, created_at TIMESTAMP(6) NOT NULL, updated_at TIMESTAMP(6) NOT NULL, version BIGINT NOT NULL DEFAULT 0, CONSTRAINT uk_tenants_slug UNIQUE (slug));
              CREATE TABLE memberships (id CHAR(36) NOT NULL PRIMARY KEY, tenant_id CHAR(36) NOT NULL, user_id CHAR(36) NOT NULL, role VARCHAR(20) NOT NULL, status VARCHAR(20) NOT NULL, created_at TIMESTAMP(6) NOT NULL, updated_at TIMESTAMP(6) NOT NULL, version BIGINT NOT NULL DEFAULT 0, CONSTRAINT fk_membership_tenant FOREIGN KEY (tenant_id) REFERENCES tenants(id), CONSTRAINT fk_membership_user FOREIGN KEY (user_id) REFERENCES users(id), CONSTRAINT uk_membership_tenant_user UNIQUE (tenant_id, user_id));
              CREATE INDEX idx_membership_user_status ON memberships(user_id, status);
              CREATE INDEX idx_membership_tenant_status ON memberships(tenant_id, status);
              CREATE TABLE invitations (id CHAR(36) NOT NULL PRIMARY KEY, tenant_id CHAR(36) NOT NULL, email VARCHAR(254) NOT NULL, role VARCHAR(20) NOT NULL, token_hash CHAR(64) NOT NULL, status VARCHAR(20) NOT NULL, invited_by CHAR(36) NOT NULL, expires_at TIMESTAMP(6) NOT NULL, accepted_at TIMESTAMP(6) NULL, created_at TIMESTAMP(6) NOT NULL, version BIGINT NOT NULL DEFAULT 0, CONSTRAINT fk_invitation_tenant FOREIGN KEY (tenant_id) REFERENCES tenants(id), CONSTRAINT fk_invitation_actor FOREIGN KEY (invited_by) REFERENCES users(id), CONSTRAINT uk_invitation_token UNIQUE (token_hash));
              CREATE INDEX idx_invitation_tenant_status ON invitations(tenant_id, status);
              CREATE INDEX idx_invitation_tenant_email ON invitations(tenant_id, email);
              CREATE TABLE refresh_sessions (id CHAR(36) NOT NULL PRIMARY KEY, family_id CHAR(36) NOT NULL, user_id CHAR(36) NOT NULL, active_tenant_id CHAR(36) NULL, current_token_hash CHAR(64) NOT NULL, previous_token_hash CHAR(64) NULL, expires_at TIMESTAMP(6) NOT NULL, revoked_at TIMESTAMP(6) NULL, created_at TIMESTAMP(6) NOT NULL, last_used_at TIMESTAMP(6) NOT NULL, version BIGINT NOT NULL DEFAULT 0, CONSTRAINT fk_refresh_user FOREIGN KEY (user_id) REFERENCES users(id), CONSTRAINT fk_refresh_tenant FOREIGN KEY (active_tenant_id) REFERENCES tenants(id), CONSTRAINT uk_refresh_current_token UNIQUE (current_token_hash));
              CREATE INDEX idx_refresh_family ON refresh_sessions(family_id);
              CREATE INDEX idx_refresh_user ON refresh_sessions(user_id, revoked_at);
              CREATE TABLE one_time_tokens (id CHAR(36) NOT NULL PRIMARY KEY, user_id CHAR(36) NOT NULL, type VARCHAR(30) NOT NULL, token_hash CHAR(64) NOT NULL, expires_at TIMESTAMP(6) NOT NULL, used_at TIMESTAMP(6) NULL, created_at TIMESTAMP(6) NOT NULL, version BIGINT NOT NULL DEFAULT 0, CONSTRAINT fk_one_time_user FOREIGN KEY (user_id) REFERENCES users(id), CONSTRAINT uk_one_time_token UNIQUE (token_hash));
              CREATE INDEX idx_one_time_user_type ON one_time_tokens(user_id, type, used_at);
              CREATE TABLE audit_events (id CHAR(36) NOT NULL PRIMARY KEY, tenant_id CHAR(36) NULL, actor_user_id CHAR(36) NULL, action VARCHAR(80) NOT NULL, target_type VARCHAR(60) NOT NULL, target_id VARCHAR(80) NULL, request_id VARCHAR(80) NULL, ip_address VARCHAR(64) NULL, details VARCHAR(1000) NULL, occurred_at TIMESTAMP(6) NOT NULL, CONSTRAINT fk_audit_tenant FOREIGN KEY (tenant_id) REFERENCES tenants(id), CONSTRAINT fk_audit_actor FOREIGN KEY (actor_user_id) REFERENCES users(id));
              CREATE INDEX idx_audit_tenant_time ON audit_events(tenant_id, occurred_at);
              CREATE INDEX idx_audit_actor_time ON audit_events(actor_user_id, occurred_at);
