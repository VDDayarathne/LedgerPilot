# Application
spring.application.name=ledgerpilot-backend
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}

# MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ledgerpilot}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# Document uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# Health checks
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Frontend origin — used by our upcoming CORS configuration
app.cors.allowed-origins=${FRONTEND_ORIGIN:http://localhost:5173}

# Authentication. Override AUTH_JWT_SECRET in every deployed environment with at
# least 32 random bytes. The checked-in value is for local development only.
app.auth.jwt-secret=${AUTH_JWT_SECRET:local-development-secret-change-me-32-bytes}
app.auth.issuer=${AUTH_JWT_ISSUER:ledgerpilot}
app.auth.audience=${AUTH_JWT_AUDIENCE:ledgerpilot-web}
app.auth.access-token-minutes=${ACCESS_TOKEN_MINUTES:10}
app.auth.refresh-token-days=${REFRESH_TOKEN_DAYS:30}
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}
app.auth.cookie-same-site=${AUTH_COOKIE_SAME_SITE:Lax}
app.auth.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:5173}

# Mail. Configure standard SPRING_MAIL_* properties in production.
app.mail.from=${MAIL_FROM:no-reply@ledgerpilot.local}
# Gmail SMTP Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
